apiVersion: v1
kind: Pod
metadata:
  name: emptydir-demo
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - while true; do echo "$(date) - Message from writer" >> /data/shared.log; sleep 5; done
      volumeMounts:
        - name: shared-storage
          mountPath: /data
    - name: reader
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - sleep 2; tail -f /data/shared.log
      volumeMounts:
        - name: shared-storage
          mountPath: /data
  volumes:
    - name: shared-storage
      emptyDir: {}
