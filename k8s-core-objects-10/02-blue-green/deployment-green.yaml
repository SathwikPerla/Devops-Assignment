apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-green
  labels:
    app: myapp
    slot: green
    version: v2
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myapp
      slot: green
  template:
    metadata:
      labels:
        app: myapp
        slot: green
        version: v2
    spec:
      containers:
        - name: web
          image: nginx:alpine
          command:
            - /bin/sh
            - -c
            - |
              echo '<!DOCTYPE html><html><body style="background:#1b5e20;color:#fff;text-align:center;padding:50px;font-family:sans-serif;"><h1>GREEN ENVIRONMENT</h1><p>Version: v2 | Slot: GREEN (STANDBY -> PROMOTED)</p></body></html>' > /usr/share/nginx/html/index.html
              nginx -g "daemon off;"
          ports:
            - containerPort: 80
