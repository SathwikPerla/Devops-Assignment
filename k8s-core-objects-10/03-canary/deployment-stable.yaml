apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-stable
  labels:
    app: myapp-canary
    track: stable
    version: v1
spec:
  replicas: 9
  selector:
    matchLabels:
      app: myapp-canary
      track: stable
  template:
    metadata:
      labels:
        app: myapp-canary
        track: stable
        version: v1
    spec:
      containers:
        - name: web
          image: nginx:alpine
          command:
            - /bin/sh
            - -c
            - |
              echo '<!DOCTYPE html><html><body><h1>STABLE v1</h1></body></html>' > /usr/share/nginx/html/index.html
              nginx -g "daemon off;"
          ports:
            - containerPort: 80
