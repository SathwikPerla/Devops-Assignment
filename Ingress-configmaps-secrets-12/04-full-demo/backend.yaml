apiVersion: apps/v1
kind: Deployment
metadata:
  name: yatri-backend
  labels:
    app: yatri-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yatri-backend
  template:
    metadata:
      labels:
        app: yatri-backend
    spec:
      containers:
      - name: api
        image: python:3.9-alpine
        command:
        - /bin/sh
        - -c
        - |
          cat << 'EOF' > server.py
          import os
          from http.server import HTTPServer, BaseHTTPRequestHandler
          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.send_header('Content-type', 'text/plain')
                  self.end_headers()
                  out = f"""Yatri Backend API
          =================
          ENVIRONMENT     : {os.getenv('ENVIRONMENT', 'unknown')}
          LOG_LEVEL       : {os.getenv('LOG_LEVEL', 'unknown')}
          DEFAULT_CURRENCY: {os.getenv('DEFAULT_CURRENCY', 'unknown')}
          POSTGRES_USER   : {os.getenv('POSTGRES_USER', 'unknown')}
          POSTGRES_DB     : {os.getenv('POSTGRES_DB', 'unknown')}
          """
                  self.wfile.write(out.encode('utf-8'))
          server = HTTPServer(('0.0.0.0', 5000), Handler)
          server.serve_forever()
          EOF
          python3 server.py
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: yatri-app-config
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: yatri-db-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: yatri-db-secret
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: yatri-db-secret
              key: POSTGRES_DB
---
apiVersion: v1
kind: Service
metadata:
  name: yatri-backend-service
  labels:
    app: yatri-backend
spec:
  type: ClusterIP
  selector:
    app: yatri-backend
  ports:
  - port: 80
    targetPort: 5000
